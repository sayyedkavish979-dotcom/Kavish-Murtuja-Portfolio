<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>404 — Page Not Found | Kavish Murtuja</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #07090e;
      color: #f8fafc;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 24px;
      text-align: center;
      background-image: radial-gradient(circle at 50% 30%, rgba(0, 210, 255, 0.12), transparent 60%);
    }
    .error-card {
      background: rgba(15, 23, 42, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 48px 36px;
      max-width: 520px;
      width: 100%;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    }
    .brand-badge {
      width: 64px;
      height: 64px;
      margin: 0 auto 20px;
      display: block;
    }
    .error-code {
      font-family: 'Outfit', sans-serif;
      font-size: 72px;
      font-weight: 800;
      line-height: 1;
      background: linear-gradient(135deg, #00d2ff 0%, #3b82f6 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 12px;
    }
    .error-title {
      font-family: 'Outfit', sans-serif;
      font-size: 24px;
      font-weight: 700;
      color: #f8fafc;
      margin-bottom: 12px;
    }
    .error-desc {
      font-size: 15px;
      line-height: 1.6;
      color: #94a3b8;
      margin-bottom: 32px;
    }
    .btn-home {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: linear-gradient(135deg, #00d2ff 0%, #3b82f6 100%);
      color: #07090e;
      font-weight: 700;
      font-size: 15px;
      text-decoration: none;
      padding: 14px 28px;
      border-radius: 9999px;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 4px 18px rgba(0, 210, 255, 0.3);
    }
    .btn-home:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 24px rgba(0, 210, 255, 0.45);
    }
  </style>
  <script>
    // GitHub Pages SPA fallback: If someone landed on an old hash or subpath, ensure safe return
    var l = window.location;
    var base = l.pathname.includes('/Kavish-Murtuja-Portfolio') ? '/Kavish-Murtuja-Portfolio/' : '/';
  </script>
</head>
<body>
  <div class="error-card">
    <img src="assets/images/branding/km-badge.svg" alt="Kavish Murtuja Monogram" class="brand-badge" width="64" height="64">
    <div class="error-code">404</div>
    <h1 class="error-title">Page Not Found</h1>
    <p class="error-desc">
      The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.
    </p>
    <a href="/Kavish-Murtuja-Portfolio/" class="btn-home">
      <span>Return to Homepage</span>
      <svg width="18" height="18" viewBox="0 0 20 20" fill="currentColor">
        <path fill-rule="evenodd" d="M10.293 3.293a1 1 0 011.414 0l6 6a1 1 0 010 1.414l-6 6a1 1 0 01-1.414-1.414L14.586 11H3a1 1 0 110-2h11.586l-4.293-4.293a1 1 0 010-1.414z" clip-rule="evenodd" />
      </svg>
    </a>
  </div>
</body>
</html>
