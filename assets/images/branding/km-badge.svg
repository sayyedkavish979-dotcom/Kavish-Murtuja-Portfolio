<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="kmBadgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d2ff" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="kmBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121624" />
      <stop offset="100%" stop-color="#090b12" />
    </linearGradient>
    <filter id="kmBadgeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Rounded Square with Luxury Border -->
  <rect x="2.5" y="2.5" width="95" height="95" rx="22" fill="url(#kmBgGrad)" stroke="url(#kmBadgeGrad)" stroke-width="2.5" />
  <!-- Letter K (Clearly separated from M) -->
  <path d="M19.5 26V74 M37 26L19.5 50L37 74" 
        stroke="url(#kmBadgeGrad)" 
        stroke-width="6.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" />
  <!-- Letter M (Clearly separated from K) -->
  <path d="M50 74V26L65.25 51L80.5 26V74" 
        stroke="url(#kmBadgeGrad)" 
        stroke-width="6.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" />
  <!-- Subtle accent dot on top-right tip of M -->
  <circle cx="80.5" cy="26" r="3.2" fill="#00d2ff" filter="url(#kmBadgeGlow)" />
</svg>
