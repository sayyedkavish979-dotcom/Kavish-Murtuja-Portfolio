<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="avatarBrandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d2ff" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <radialGradient id="avatarRadialGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00d2ff" stop-opacity="0.25" />
      <stop offset="70%" stop-color="#3b82f6" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#07090e" stop-opacity="0" />
    </radialGradient>
    <filter id="avatarGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Canvas -->
  <rect width="512" height="512" fill="#07090e" />
  <circle cx="256" cy="256" r="230" fill="url(#avatarRadialGlow)" />
  <!-- Outer Luxury Ring -->
  <circle cx="256" cy="256" r="210" fill="#0d111c" stroke="url(#avatarBrandGrad)" stroke-width="6" stroke-opacity="0.7" />
  <!-- Centered Scaled KM Monogram -->
  <g transform="translate(136, 136) scale(2.4)">
    <!-- Letter K (Clearly separated from M) -->
    <path d="M19.5 26V74 M37 26L19.5 50L37 74" 
          stroke="url(#avatarBrandGrad)" 
          stroke-width="6.5" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          filter="url(#avatarGlow)" />
    <!-- Letter M (Clearly separated from K) -->
    <path d="M50 74V26L65.25 51L80.5 26V74" 
          stroke="url(#avatarBrandGrad)" 
          stroke-width="6.5" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          filter="url(#avatarGlow)" />
    <circle cx="80.5" cy="26" r="3.2" fill="#00d2ff" />
  </g>
</svg>
