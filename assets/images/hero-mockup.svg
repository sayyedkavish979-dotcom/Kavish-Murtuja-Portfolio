<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" width="100%" height="100%">
  <defs>
    <linearGradient id="heroDeviceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#04070e" />
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="cardGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>
    <filter id="floatShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.65" />
    </filter>
    <filter id="badgeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#6366f1" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Ambient background glow behind device -->
  <circle cx="450" cy="320" r="280" fill="#4338ca" opacity="0.15" filter="url(#badgeGlow)" />
  <circle cx="650" cy="220" r="180" fill="#06b6d4" opacity="0.12" filter="url(#badgeGlow)" />

  <!-- MAIN BROWSER / DESKTOP WINDOW -->
  <g filter="url(#floatShadow)">
    <!-- Window Body -->
    <rect x="60" y="70" width="700" height="460" rx="16" fill="url(#heroDeviceGrad)" stroke="#334155" stroke-width="1.5" />
    
    <!-- Top Bar -->
    <rect x="60" y="70" width="700" height="42" rx="16" fill="#182234" />
    <rect x="60" y="102" width="700" height="10" fill="#182234" />
    <circle cx="85" cy="91" r="5.5" fill="#ef4444" />
    <circle cx="102" cy="91" r="5.5" fill="#f59e0b" />
    <circle cx="119" cy="91" r="5.5" fill="#10b981" />
    
    <!-- Address Bar -->
    <rect x="145" y="80" width="380" height="22" rx="6" fill="#0f172a" />
    <circle cx="160" cy="91" r="3.5" fill="#10b981" />
    <text x="175" y="95" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11">https://kavishmurtuja.design/client-project</text>

    <!-- Browser Screen Content -->
    <rect x="61" y="112" width="698" height="417" fill="url(#screenGrad)" rx="0" />

    <!-- Simulated Website Header -->
    <g transform="translate(90, 130)">
      <!-- Logo -->
      <rect x="0" y="0" width="28" height="28" rx="8" fill="url(#accentGlow)" />
      <text x="38" y="19" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="15">NEXUS BRAND</text>
      
      <!-- Nav Links -->
      <rect x="260" y="8" width="45" height="8" rx="4" fill="#334155" />
      <rect x="320" y="8" width="55" height="8" rx="4" fill="#334155" />
      <rect x="390" y="8" width="50" height="8" rx="4" fill="#334155" />
      <rect x="530" y="2" width="95" height="24" rx="12" fill="url(#accentGlow)" />
      <text x="548" y="17" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="10">GET STARTED</text>
    </g>

    <!-- Simulated Website Hero -->
    <g transform="translate(90, 185)">
      <!-- Hero Tag -->
      <rect x="0" y="0" width="130" height="20" rx="10" fill="#1e1b4b" stroke="#6366f1" stroke-width="1" />
      <text x="12" y="14" fill="#a5b4fc" font-family="sans-serif" font-size="9" font-weight="600">HIGH CONVERTING WEB</text>

      <!-- Headline -->
      <text x="0" y="48" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="22">Engineered For Growth</text>
      <text x="0" y="74" fill="#818cf8" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="22">&amp; Seamless User Experience</text>
      
      <!-- Body bars -->
      <rect x="0" y="92" width="280" height="8" rx="4" fill="#334155" />
      <rect x="0" y="106" width="230" height="8" rx="4" fill="#334155" />

      <!-- Action buttons -->
      <rect x="0" y="130" width="120" height="32" rx="6" fill="url(#accentGlow)" />
      <text x="22" y="150" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="10.5">LAUNCH SITE</text>
      <rect x="135" y="130" width="110" height="32" rx="6" fill="none" stroke="#475569" stroke-width="1" />
      <text x="155" y="150" fill="#94a3b8" font-family="sans-serif" font-weight="600" font-size="10.5">PORTFOLIO</text>

      <!-- Mini Metrics Cards -->
      <g transform="translate(0, 180)">
        <rect x="0" y="0" width="95" height="50" rx="6" fill="#111c30" stroke="#1e293b" />
        <text x="10" y="22" fill="#38bdf8" font-family="sans-serif" font-weight="bold" font-size="14">3.4x</text>
        <text x="10" y="38" fill="#64748b" font-family="sans-serif" font-size="8.5">Leads Growth</text>

        <rect x="105" y="0" width="95" height="50" rx="6" fill="#111c30" stroke="#1e293b" />
        <text x="115" y="22" fill="#34d399" font-family="sans-serif" font-weight="bold" font-size="14">0.4s</text>
        <text x="115" y="38" fill="#64748b" font-family="sans-serif" font-size="8.5">Load Speed</text>

        <rect x="210" y="0" width="95" height="50" rx="6" fill="#111c30" stroke="#1e293b" />
        <text x="220" y="22" fill="#fbbf24" font-family="sans-serif" font-weight="bold" font-size="14">100%</text>
        <text x="220" y="38" fill="#64748b" font-family="sans-serif" font-size="8.5">Responsive</text>
      </g>
    </g>

    <!-- Simulated Website Visual Mockup (Right of Screen) -->
    <g transform="translate(430, 180)">
      <rect x="0" y="0" width="290" height="235" rx="10" fill="#131e33" stroke="#253554" stroke-width="1.5" />
      <rect x="15" y="15" width="260" height="110" rx="6" fill="#0b1220" />
      
      <!-- Abstract interface bars -->
      <rect x="30" y="30" width="100" height="12" rx="4" fill="url(#accentGlow)" />
      <rect x="30" y="52" width="180" height="8" rx="4" fill="#1e293b" />
      <rect x="30" y="66" width="150" height="8" rx="4" fill="#1e293b" />
      
      <!-- Mini graph in website -->
      <path d="M30 110 L70 95 L110 102 L150 85 L190 92 L230 70" stroke="#06b6d4" stroke-width="2" fill="none" />
      <circle cx="230" cy="70" r="3.5" fill="#38bdf8" />

      <!-- Product cards under -->
      <rect x="15" y="140" width="122" height="75" rx="6" fill="#0d1728" stroke="#1c2d47" />
      <rect x="25" y="150" width="40" height="8" rx="3" fill="#818cf8" />
      <rect x="25" y="166" width="95" height="6" rx="3" fill="#334155" />
      <text x="25" y="196" fill="#34d399" font-family="sans-serif" font-weight="bold" font-size="11">₹14,999</text>

      <rect x="152" y="140" width="122" height="75" rx="6" fill="#0d1728" stroke="#1c2d47" />
      <rect x="162" y="150" width="40" height="8" rx="3" fill="#f43f5e" />
      <rect x="162" y="166" width="95" height="6" rx="3" fill="#334155" />
      <text x="162" y="196" fill="#34d399" font-family="sans-serif" font-weight="bold" font-size="11">₹24,999</text>
    </g>
  </g>

  <!-- FLOATING SMARTPHONE DEVICE (Overlap at right corner) -->
  <g transform="translate(680, 220)" filter="url(#floatShadow)">
    <!-- Phone Body -->
    <rect x="0" y="0" width="190" height="380" rx="32" fill="#0f172a" stroke="#475569" stroke-width="3" />
    <rect x="6" y="6" width="178" height="368" rx="26" fill="#070b14" />
    
    <!-- Dynamic Island / Speaker Notch -->
    <rect x="60" y="16" width="70" height="16" rx="8" fill="#000000" />
    <circle cx="115" cy="24" r="3" fill="#1e293b" />

    <!-- Mobile Screen UI -->
    <!-- Mobile Header -->
    <rect x="22" y="46" width="22" height="22" rx="6" fill="url(#accentGlow)" />
    <rect x="145" y="52" width="20" height="3" rx="1.5" fill="#94a3b8" />
    <rect x="145" y="59" width="20" height="3" rx="1.5" fill="#94a3b8" />
    <rect x="145" y="66" width="14" height="3" rx="1.5" fill="#94a3b8" />

    <!-- Mobile Hero -->
    <text x="22" y="95" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="13">Modern UI That</text>
    <text x="22" y="112" fill="#38bdf8" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="13">Converts 24/7</text>
    <text x="22" y="130" fill="#94a3b8" font-family="sans-serif" font-size="8.5">Engineered for mobile.</text>
    
    <rect x="22" y="145" width="146" height="28" rx="6" fill="url(#accentGlow)" />
    <text x="58" y="163" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="9.5">VIEW DEMO</text>

    <!-- Mobile Card -->
    <rect x="22" y="185" width="146" height="85" rx="8" fill="#111e33" stroke="#233554" />
    <rect x="34" y="197" width="65" height="8" rx="3" fill="#818cf8" />
    <rect x="34" y="212" width="115" height="5" rx="2.5" fill="#334155" />
    <rect x="34" y="222" width="90" height="5" rx="2.5" fill="#334155" />
    <rect x="34" y="240" width="60" height="18" rx="4" fill="#10b981" />
    <text x="44" y="253" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="8.5">ACTIVE</text>

    <!-- Mobile Bottom Navigation Bar -->
    <rect x="15" y="325" width="160" height="36" rx="18" fill="#131c2d" stroke="#22334e" />
    <circle cx="45" cy="343" r="7" fill="#6366f1" />
    <circle cx="95" cy="343" r="6" fill="#475569" />
    <circle cx="145" cy="343" r="6" fill="#475569" />

    <!-- Home Indicator -->
    <rect x="65" y="365" width="60" height="4" rx="2" fill="#475569" />
  </g>

  <!-- FLOATING BADGE 1: SPEED & CORE WEB VITALS (Top Left) -->
  <g transform="translate(20, 180)" filter="url(#floatShadow)">
    <rect x="0" y="0" width="195" height="66" rx="12" fill="url(#cardGlass)" stroke="#334155" stroke-width="1.5" />
    <!-- Score circle -->
    <circle cx="34" cy="33" r="20" fill="#064e3b" stroke="#10b981" stroke-width="2" />
    <text x="24" y="38" fill="#34d399" font-family="sans-serif" font-weight="900" font-size="14">99</text>
    <text x="64" y="27" fill="#f8fafc" font-family="sans-serif" font-weight="700" font-size="11">PageSpeed Score</text>
    <text x="64" y="44" fill="#10b981" font-family="sans-serif" font-weight="600" font-size="9.5">✓ Core Web Vitals Passed</text>
    <text x="64" y="55" fill="#64748b" font-family="sans-serif" font-size="8">Ultra-fast loading in &lt; 0.5s</text>
  </g>

  <!-- FLOATING BADGE 2: 100% RESPONSIVE (Bottom Left) -->
  <g transform="translate(30, 480)" filter="url(#floatShadow)">
    <rect x="0" y="0" width="220" height="74" rx="12" fill="url(#cardGlass)" stroke="#38bdf8" stroke-opacity="0.5" stroke-width="1.5" />
    <!-- Devices Icon -->
    <rect x="15" y="17" width="38" height="38" rx="8" fill="#082f49" />
    <!-- Icon shapes -->
    <rect x="23" y="24" width="18" height="13" rx="2" fill="none" stroke="#38bdf8" stroke-width="1.5" />
    <rect x="33" y="32" width="12" height="16" rx="2" fill="#0369a1" stroke="#38bdf8" stroke-width="1.5" />
    
    <text x="62" y="33" fill="#ffffff" font-family="sans-serif" font-weight="700" font-size="11.5">100% Fully Responsive</text>
    <text x="62" y="48" fill="#38bdf8" font-family="sans-serif" font-size="9.5">Mobile • Tablet • 4K Desktop</text>
    <text x="62" y="60" fill="#94a3b8" font-family="sans-serif" font-size="8.5">Tested across all viewport sizes</text>
  </g>

  <!-- FLOATING BADGE 3: CLIENT TRUST & VERIFIED CODE (Bottom Center) -->
  <g transform="translate(390, 520)" filter="url(#floatShadow)">
    <rect x="0" y="0" width="260" height="74" rx="12" fill="url(#cardGlass)" stroke="#a855f7" stroke-opacity="0.5" stroke-width="1.5" />
    <rect x="14" y="16" width="42" height="42" rx="10" fill="#2e1065" />
    <!-- Code check icon -->
    <text x="24" y="42" fill="#c084fc" font-family="monospace" font-weight="900" font-size="18">&lt;/&gt;</text>
    
    <text x="66" y="32" fill="#ffffff" font-family="sans-serif" font-weight="700" font-size="11.5">Clean &amp; Handcrafted Code</text>
    <text x="66" y="47" fill="#fbbf24" font-family="sans-serif" font-size="10">★★★★★ High Client Satisfaction</text>
    <text x="66" y="61" fill="#94a3b8" font-family="sans-serif" font-size="8.5">Kavish Murtuja • Kanpur, India</text>
  </g>
</svg>
