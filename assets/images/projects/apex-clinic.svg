<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="clinicBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071317" />
      <stop offset="50%" stop-color="#0a1920" />
      <stop offset="100%" stop-color="#040b0e" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6" />
      <stop offset="50%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
    <linearGradient id="clinicCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f262c" />
      <stop offset="100%" stop-color="#08171b" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="500" rx="16" fill="url(#clinicBg)" />
  <rect x="1" y="1" width="798" height="498" rx="15" fill="none" stroke="#14b8a6" stroke-opacity="0.25" stroke-width="1.5" />

  <!-- Browser Header Bar -->
  <rect x="0" y="0" width="800" height="42" rx="16" fill="#081a20" />
  <rect x="0" y="32" width="800" height="10" fill="#081a20" />
  <circle cx="24" cy="21" r="5" fill="#ef4444" />
  <circle cx="40" cy="21" r="5" fill="#f59e0b" />
  <circle cx="56" cy="21" r="5" fill="#10b981" />
  <rect x="80" y="11" width="340" height="20" rx="6" fill="#0e2a32" />
  <text x="100" y="25" fill="#5eead4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11">https://apexclinic-health.demo</text>

  <!-- Navigation -->
  <text x="40" y="76" fill="#2dd4bf" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="18" letter-spacing="1">APEX CLINIC</text>
  <text x="40" y="90" fill="#14b8a6" font-family="sans-serif" font-size="8.5" letter-spacing="1">HEALTHCARE &amp; DENTAL EXCELLENCE</text>
  
  <text x="420" y="80" fill="#ccfbf1" font-family="sans-serif" font-size="11" opacity="0.8">Doctors</text>
  <text x="480" y="80" fill="#ccfbf1" font-family="sans-serif" font-size="11" opacity="0.8">Treatments</text>
  <text x="560" y="80" fill="#ccfbf1" font-family="sans-serif" font-size="11" opacity="0.8">Testimonials</text>
  <rect x="645" y="62" width="120" height="30" rx="15" fill="url(#tealGrad)" />
  <text x="660" y="81" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="10.5">BOOK VISIT</text>

  <!-- Hero Content -->
  <g transform="translate(40, 125)">
    <rect x="0" y="0" width="165" height="20" rx="10" fill="#042f2e" stroke="#14b8a6" stroke-opacity="0.4" />
    <text x="12" y="14" fill="#5eead4" font-family="sans-serif" font-size="9" font-weight="600">NABH ACCREDITED FACILITY</text>
    
    <text x="0" y="55" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="28">Compassionate Care,</text>
    <text x="0" y="90" fill="#2dd4bf" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="28">Modern Medical Tech</text>
    
    <text x="0" y="125" fill="#94a3b8" font-family="sans-serif" font-size="12">
      Dedicated team of certified specialists providing painless dental,
    </text>
    <text x="0" y="145" fill="#94a3b8" font-family="sans-serif" font-size="12">
      pediatric, and preventive health consultations with zero wait time.
    </text>

    <!-- Buttons -->
    <rect x="0" y="175" width="150" height="38" rx="8" fill="url(#tealGrad)" />
    <text x="20" y="199" fill="#ffffff" font-family="sans-serif" font-weight="700" font-size="11.5">BOOK DOCTOR VISIT</text>
    
    <rect x="162" y="175" width="145" height="38" rx="8" fill="none" stroke="#14b8a6" stroke-width="1.5" />
    <text x="186" y="199" fill="#5eead4" font-family="sans-serif" font-weight="600" font-size="11.5">WHATSAPP CLINIC</text>
  </g>

  <!-- Right Visual Cards Simulation -->
  <g transform="translate(450, 125)">
    <!-- Service Card 1: Dental -->
    <rect x="0" y="0" width="310" height="100" rx="12" fill="url(#clinicCard)" stroke="#14b8a6" stroke-opacity="0.2" />
    <circle cx="45" cy="50" r="24" fill="#042f2e" />
    <text x="36" y="56" fill="#2dd4bf" font-size="18">🦷</text>
    <text x="85" y="42" fill="#ffffff" font-family="sans-serif" font-weight="700" font-size="14">Advanced Dental Care</text>
    <text x="85" y="60" fill="#94a3b8" font-family="sans-serif" font-size="11">Laser Whitening, Implants &amp; Aligners</text>
    <text x="85" y="80" fill="#2dd4bf" font-family="sans-serif" font-weight="700" font-size="12">Dr. Ananya Verma • BDS, MDS</text>

    <!-- Service Card 2: Diagnostics -->
    <rect x="0" y="115" width="310" height="100" rx="12" fill="url(#clinicCard)" stroke="#14b8a6" stroke-opacity="0.2" />
    <circle cx="45" cy="165" r="24" fill="#042f2e" />
    <text x="36" y="171" fill="#2dd4bf" font-size="18">🩺</text>
    <text x="85" y="157" fill="#ffffff" font-family="sans-serif" font-weight="700" font-size="14">Full Body Checkups</text>
    <text x="85" y="175" fill="#94a3b8" font-family="sans-serif" font-size="11">Digital X-Ray, Blood Work &amp; ECG</text>
    <text x="85" y="195" fill="#2dd4bf" font-family="sans-serif" font-weight="700" font-size="12">Same-Day Digital Reports</text>

    <!-- Trust Badge -->
    <rect x="0" y="230" width="310" height="42" rx="8" fill="#081a20" stroke="#14b8a6" stroke-opacity="0.3" />
    <text x="20" y="256" fill="#14b8a6" font-size="14">🏥</text>
    <text x="45" y="256" fill="#cbd5e1" font-family="sans-serif" font-size="11" font-weight="500">12,000+ Verified Patient Consultations</text>
  </g>
</svg>
