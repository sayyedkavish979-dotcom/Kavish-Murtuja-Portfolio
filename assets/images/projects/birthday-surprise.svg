<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bdayBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140f28" />
      <stop offset="50%" stop-color="#090a18" />
      <stop offset="100%" stop-color="#04050d" />
    </linearGradient>
    <linearGradient id="roseGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="50%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="amethyst" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#fde68a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="500" rx="16" fill="url(#bdayBg)" />
  <rect x="1" y="1" width="798" height="498" rx="15" fill="none" stroke="#f43f5e" stroke-opacity="0.3" stroke-width="1.5" />

  <!-- Ambient Glow Orbs -->
  <circle cx="150" cy="180" r="140" fill="#f43f5e" opacity="0.12" filter="url(#glow)" />
  <circle cx="680" cy="320" r="160" fill="#8b5cf6" opacity="0.14" filter="url(#glow)" />

  <!-- Browser Header Bar -->
  <rect x="0" y="0" width="800" height="42" rx="16" fill="#181930" />
  <rect x="0" y="32" width="800" height="10" fill="#181930" />
  <circle cx="24" cy="21" r="5" fill="#ef4444" />
  <circle cx="40" cy="21" r="5" fill="#f59e0b" />
  <circle cx="56" cy="21" r="5" fill="#10b981" />
  <rect x="80" y="11" width="370" height="20" rx="6" fill="#252748" />
  <text x="100" y="25" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11">https://kavishmurtuja.com/birthday-surprise</text>

  <!-- Status Badge -->
  <rect x="630" y="12" width="130" height="18" rx="9" fill="rgba(244,63,94,0.2)" stroke="rgba(244,63,94,0.4)" stroke-width="1" />
  <circle cx="642" cy="21" r="3" fill="#f43f5e" />
  <text x="652" y="24" fill="#fda4af" font-family="-apple-system, sans-serif" font-size="9" font-weight="700">CONCEPT DEMO</text>

  <!-- Festive Balloons Graphic Left & Right -->
  <g transform="translate(60, 110)">
    <path d="M0,40 Q-25,0 0,-35 Q25,0 0,40 Z" fill="#f43f5e" opacity="0.85" />
    <path d="M0,40 L-2,75 Q-5,85 0,95" stroke="rgba(255,255,255,0.3)" fill="none" stroke-width="1.5" />
  </g>
  <g transform="translate(105, 80)">
    <path d="M0,45 Q-28,0 0,-40 Q28,0 0,45 Z" fill="#8b5cf6" opacity="0.8" />
    <path d="M0,45 L-2,85 Q2,95 -2,105" stroke="rgba(255,255,255,0.3)" fill="none" stroke-width="1.5" />
  </g>
  <g transform="translate(710, 100)">
    <path d="M0,42 Q-26,0 0,-38 Q26,0 0,42 Z" fill="#f59e0b" opacity="0.85" />
    <path d="M0,42 L2,80 Q5,90 2,100" stroke="rgba(255,255,255,0.3)" fill="none" stroke-width="1.5" />
  </g>
  <g transform="translate(660, 75)">
    <path d="M0,46 Q-28,0 0,-42 Q28,0 0,46 Z" fill="#ec4899" opacity="0.75" />
    <path d="M0,46 L-2,90 Q-4,100 0,110" stroke="rgba(255,255,255,0.3)" fill="none" stroke-width="1.5" />
  </g>

  <!-- Confetti Stars & Shapes -->
  <circle cx="190" cy="90" r="4" fill="#fbbf24" opacity="0.8" />
  <circle cx="230" cy="140" r="3" fill="#f43f5e" opacity="0.7" />
  <circle cx="580" cy="110" r="4" fill="#a78bfa" opacity="0.8" />
  <circle cx="610" cy="160" r="3" fill="#38bdf8" opacity="0.7" />
  <polygon points="170,165 174,175 185,176 177,184 179,195 170,189 161,195 163,184 155,176 166,175" fill="#fde68a" opacity="0.7" transform="scale(0.8) translate(30,-10)" />
  <polygon points="630,200 634,210 645,211 637,219 639,230 630,224 621,230 623,219 615,211 626,210" fill="#f43f5e" opacity="0.6" transform="scale(0.7) translate(280,-20)" />

  <!-- Hero Content Center -->
  <rect x="310" y="65" width="180" height="26" rx="13" fill="rgba(244,63,94,0.12)" stroke="rgba(244,63,94,0.35)" />
  <text x="400" y="82" fill="#fda4af" font-family="'Outfit', -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="2">✨ CELEBRATION DAY ✨</text>

  <text x="400" y="132" fill="url(#roseGold)" font-family="'Outfit', -apple-system, sans-serif" font-size="42" font-weight="900" text-anchor="middle" letter-spacing="-1">Happy Birthday!</text>
  <text x="400" y="168" fill="#e2e8f0" font-family="'Outfit', -apple-system, sans-serif" font-size="20" font-weight="700" text-anchor="middle">To Someone Special — <tspan fill="#f59e0b">Alex</tspan></text>
  <text x="400" y="194" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12" text-anchor="middle">Personalized Interactive Surprise Experience • Memories • Wish Celebration</text>

  <!-- Interactive Tiered Birthday Cake Illustration -->
  <g transform="translate(400, 310)">
    <!-- Plate -->
    <ellipse cx="0" cy="115" rx="140" ry="14" fill="#334155" />
    <ellipse cx="0" cy="112" rx="136" ry="12" fill="#475569" />

    <!-- Cake Base Tier -->
    <rect x="-105" y="55" width="210" height="55" rx="10" fill="#ea580c" />
    <rect x="-105" y="55" width="210" height="15" rx="6" fill="#fde047" opacity="0.9" />

    <!-- Cake Mid Tier -->
    <rect x="-80" y="10" width="160" height="48" rx="8" fill="#7c3aed" />
    <rect x="-80" y="10" width="160" height="14" rx="6" fill="#f472b6" opacity="0.9" />

    <!-- Cake Top Tier -->
    <rect x="-55" y="-30" width="110" height="42" rx="8" fill="#db2777" />
    <rect x="-55" y="-30" width="110" height="12" rx="5" fill="#ffffff" opacity="0.9" />

    <!-- Candle -->
    <rect x="-4" y="-62" width="8" height="34" rx="2" fill="#38bdf8" />
    <!-- Candle Flame -->
    <ellipse cx="0" cy="-72" rx="6" ry="12" fill="#fde047" />
    <ellipse cx="0" cy="-70" rx="3" ry="7" fill="#ea580c" />
    <circle cx="0" cy="-72" r="14" fill="#f59e0b" opacity="0.35" filter="url(#glow)" />
  </g>

  <!-- Feature Tags Footer Row -->
  <g transform="translate(140, 445)">
    <rect x="0" y="0" width="115" height="28" rx="14" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" />
    <text x="57" y="18" fill="#f1f5f9" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle">🎁 Opening Surprise</text>

    <rect x="128" y="0" width="118" height="28" rx="14" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" />
    <text x="187" y="18" fill="#f1f5f9" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle">📸 Memory Gallery</text>

    <rect x="259" y="0" width="115" height="28" rx="14" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" />
    <text x="316" y="18" fill="#f1f5f9" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle">⏳ Milestone Story</text>

    <rect x="387" y="0" width="130" height="28" rx="14" fill="rgba(245,158,11,0.15)" stroke="rgba(245,158,11,0.35)" />
    <text x="452" y="18" fill="#fde68a" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">🎂 Make a Wish ✨</text>
  </g>
</svg>
