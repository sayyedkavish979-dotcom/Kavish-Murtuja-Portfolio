<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="csBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12081c" />
      <stop offset="50%" stop-color="#180c26" />
      <stop offset="100%" stop-color="#090310" />
    </linearGradient>
    <linearGradient id="agencyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="artCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#241038" />
      <stop offset="100%" stop-color="#140821" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="500" rx="16" fill="url(#csBg)" />
  <rect x="1" y="1" width="798" height="498" rx="15" fill="none" stroke="#a855f7" stroke-opacity="0.3" stroke-width="1.5" />

  <!-- Browser Header Bar -->
  <rect x="0" y="0" width="800" height="42" rx="16" fill="#140a1f" />
  <rect x="0" y="32" width="800" height="10" fill="#140a1f" />
  <circle cx="24" cy="21" r="5" fill="#ef4444" />
  <circle cx="40" cy="21" r="5" fill="#f59e0b" />
  <circle cx="56" cy="21" r="5" fill="#10b981" />
  <rect x="80" y="11" width="340" height="20" rx="6" fill="#211233" />
  <text x="100" y="25" fill="#e9d5ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11">https://creativestudio-design.demo</text>

  <!-- Navigation -->
  <text x="40" y="76" fill="#f472b6" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="19" letter-spacing="1">CREATIVE.STUDIO</text>
  <text x="40" y="90" fill="#c084fc" font-family="sans-serif" font-size="8.5" letter-spacing="1">GLOBAL BRANDING &amp; DIGITAL PRODUCTION</text>
  
  <text x="410" y="80" fill="#e2e8f0" font-family="sans-serif" font-size="11" opacity="0.8">Case Studies</text>
  <text x="500" y="80" fill="#e2e8f0" font-family="sans-serif" font-size="11" opacity="0.8">Services</text>
  <text x="565" y="80" fill="#e2e8f0" font-family="sans-serif" font-size="11" opacity="0.8">Culture</text>
  <rect x="635" y="62" width="125" height="30" rx="15" fill="url(#agencyGrad)" />
  <text x="662" y="81" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="10.5">START A BRIEF</text>

  <!-- Hero Content -->
  <g transform="translate(40, 125)">
    <rect x="0" y="0" width="140" height="20" rx="10" fill="#3b0764" stroke="#c084fc" stroke-opacity="0.4" />
    <text x="12" y="14" fill="#f0abfc" font-family="sans-serif" font-size="9" font-weight="600">AWWWARDS SOTD 2026</text>
    
    <text x="0" y="55" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="28">We Sculpt</text>
    <text x="0" y="90" fill="#f472b6" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="28">Unforgettable Brands</text>
    
    <text x="0" y="125" fill="#cbd5e1" font-family="sans-serif" font-size="12">
      Multidisciplinary design boutique crafting high-impact
    </text>
    <text x="0" y="145" fill="#cbd5e1" font-family="sans-serif" font-size="12">
      visual identities, 3D campaigns, and interactive web art.
    </text>

    <!-- Buttons -->
    <rect x="0" y="175" width="140" height="38" rx="8" fill="url(#agencyGrad)" />
    <text x="24" y="199" fill="#ffffff" font-family="sans-serif" font-weight="700" font-size="11.5">VIEW SHOWREEL</text>

    <rect x="155" y="175" width="125" height="38" rx="8" fill="none" stroke="#ec4899" stroke-width="1.5" />
    <text x="178" y="199" fill="#f472b6" font-family="sans-serif" font-weight="600" font-size="11.5">OUR WORK (38)</text>
  </g>

  <!-- Visual Creative Media Card -->
  <g transform="translate(430, 115)">
    <rect x="0" y="0" width="330" height="230" rx="14" fill="url(#artCard)" stroke="#3b1d5c" stroke-width="1.5" />
    
    <!-- Graphic Abstract Art -->
    <rect x="20" y="20" width="290" height="130" rx="10" fill="#0f0517" />
    
    <!-- Fluid dynamic shapes -->
    <circle cx="165" cy="85" r="55" fill="url(#agencyGrad)" opacity="0.8" />
    <circle cx="210" cy="70" r="40" fill="#6366f1" opacity="0.6" />
    <circle cx="120" cy="95" r="35" fill="#ec4899" opacity="0.7" />
    
    <!-- Play button overlay -->
    <circle cx="165" cy="85" r="24" fill="#ffffff" fill-opacity="0.25" stroke="#ffffff" stroke-width="1.5" />
    <polygon points="160,74 175,85 160,96" fill="#ffffff" />

    <!-- Badges on image -->
    <rect x="30" y="30" width="75" height="20" rx="6" fill="#831843" />
    <text x="38" y="44" fill="#fbcfe8" font-family="sans-serif" font-weight="bold" font-size="9">BRAND REEL</text>

    <!-- Info -->
    <rect x="20" y="165" width="290" height="52" rx="8" fill="#0c0414" stroke="#2a143d" />
    <text x="32" y="185" fill="#f8fafc" font-family="sans-serif" font-weight="700" font-size="12">Nebula Kinetic 3D Identity</text>
    <text x="32" y="202" fill="#c084fc" font-family="sans-serif" font-size="9.5">Motion Identity • Design Direction • Sound Design</text>
    <text x="245" y="194" fill="#f472b6" font-family="sans-serif" font-weight="800" font-size="12.5">SEE CASE →</text>
  </g>

  <!-- Bottom Featured Agency Trophies & Clients -->
  <g transform="translate(40, 375)">
    <rect x="0" y="0" width="220" height="95" rx="10" fill="#150921" stroke="#2d1345" stroke-width="1" />
    <text x="18" y="28" fill="#f472b6" font-family="sans-serif" font-weight="700" font-size="11">Brand Architecture</text>
    <text x="18" y="46" fill="#cbd5e1" font-family="sans-serif" font-size="9.5">Complete brand identity systems,</text>
    <text x="18" y="60" fill="#cbd5e1" font-family="sans-serif" font-size="9.5">guidelines, typography &amp; voice.</text>
    <text x="18" y="80" fill="#c084fc" font-family="sans-serif" font-size="9" font-weight="bold">Explore Process →</text>

    <rect x="250" y="0" width="220" height="95" rx="10" fill="#150921" stroke="#2d1345" stroke-width="1" />
    <text x="268" y="28" fill="#f472b6" font-family="sans-serif" font-weight="700" font-size="11">3D Motion &amp; CGI</text>
    <text x="268" y="46" fill="#cbd5e1" font-family="sans-serif" font-size="9.5">Immersive interactive 3D WebGL,</text>
    <text x="268" y="60" fill="#cbd5e1" font-family="sans-serif" font-size="9.5">cinematic trailers &amp; animations.</text>
    <text x="268" y="80" fill="#c084fc" font-family="sans-serif" font-size="9" font-weight="bold">View Renders →</text>

    <rect x="500" y="0" width="260" height="95" rx="10" fill="#150921" stroke="#2d1345" stroke-width="1" />
    <text x="518" y="28" fill="#f472b6" font-family="sans-serif" font-weight="700" font-size="11">Awards &amp; Recognition</text>
    <text x="518" y="46" fill="#cbd5e1" font-family="sans-serif" font-size="9.5">14x Awwwards, 9x FWA of the Day,</text>
    <text x="518" y="60" fill="#cbd5e1" font-family="sans-serif" font-size="9.5">and featured in Brand New &amp; It's Nice That.</text>
    <text x="518" y="80" fill="#c084fc" font-family="sans-serif" font-size="9" font-weight="bold">Awards List →</text>
  </g>
</svg>
