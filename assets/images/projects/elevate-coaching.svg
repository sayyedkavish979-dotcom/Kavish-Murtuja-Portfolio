<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="coachBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#110d1c" />
      <stop offset="50%" stop-color="#161026" />
      <stop offset="100%" stop-color="#090611" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <linearGradient id="coachCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#23193d" />
      <stop offset="100%" stop-color="#150e26" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="500" rx="16" fill="url(#coachBg)" />
  <rect x="1" y="1" width="798" height="498" rx="15" fill="none" stroke="#8b5cf6" stroke-opacity="0.25" stroke-width="1.5" />

  <!-- Browser Header Bar -->
  <rect x="0" y="0" width="800" height="42" rx="16" fill="#171128" />
  <rect x="0" y="32" width="800" height="10" fill="#171128" />
  <circle cx="24" cy="21" r="5" fill="#ef4444" />
  <circle cx="40" cy="21" r="5" fill="#f59e0b" />
  <circle cx="56" cy="21" r="5" fill="#10b981" />
  <rect x="80" y="11" width="340" height="20" rx="6" fill="#281c44" />
  <text x="100" y="25" fill="#c4b5fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11">https://elevate-executive.demo</text>

  <!-- Navigation -->
  <text x="40" y="76" fill="#a78bfa" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="18" letter-spacing="1">ELEVATE COACHING</text>
  <text x="40" y="90" fill="#8b5cf6" font-family="sans-serif" font-size="8.5" letter-spacing="1">EXECUTIVE LEADERSHIP &amp; CAREER ACCELERATION</text>
  
  <text x="420" y="80" fill="#ddd6fe" font-family="sans-serif" font-size="11" opacity="0.8">Programs</text>
  <text x="490" y="80" fill="#ddd6fe" font-family="sans-serif" font-size="11" opacity="0.8">Case Studies</text>
  <text x="580" y="80" fill="#ddd6fe" font-family="sans-serif" font-size="11" opacity="0.8">Podcast</text>
  <rect x="645" y="62" width="120" height="30" rx="15" fill="url(#purpleGrad)" />
  <text x="660" y="81" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="10.5">BOOK CALL</text>

  <!-- Hero Content -->
  <g transform="translate(40, 125)">
    <rect x="0" y="0" width="150" height="20" rx="10" fill="#3b1d75" stroke="#8b5cf6" stroke-opacity="0.4" />
    <text x="12" y="14" fill="#ddd6fe" font-family="sans-serif" font-size="9" font-weight="600">1-ON-1 MENTORSHIP</text>
    
    <text x="0" y="55" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="28">Scale Your Leadership</text>
    <text x="0" y="90" fill="#a78bfa" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="28">&amp; Career Impact</text>
    
    <text x="0" y="125" fill="#94a3b8" font-family="sans-serif" font-size="12">
      Proven 90-day frameworks designed for senior professionals,
    </text>
    <text x="0" y="145" fill="#94a3b8" font-family="sans-serif" font-size="12">
      founders, and executives ready to double their organizational output.
    </text>

    <!-- Buttons -->
    <rect x="0" y="175" width="150" height="38" rx="8" fill="url(#purpleGrad)" />
    <text x="24" y="199" fill="#ffffff" font-family="sans-serif" font-weight="700" font-size="11.5">APPLY FOR COHORT</text>
    
    <rect x="162" y="175" width="145" height="38" rx="8" fill="none" stroke="#8b5cf6" stroke-width="1.5" />
    <text x="180" y="199" fill="#ddd6fe" font-family="sans-serif" font-weight="600" font-size="11.5">FREE STRATEGY CALL</text>
  </g>

  <!-- Right Visual Cards Simulation -->
  <g transform="translate(450, 125)">
    <!-- Result Card 1 -->
    <rect x="0" y="0" width="310" height="100" rx="12" fill="url(#coachCard)" stroke="#8b5cf6" stroke-opacity="0.2" />
    <circle cx="45" cy="50" r="24" fill="#3b1d75" />
    <text x="36" y="56" fill="#a78bfa" font-size="18">📈</text>
    <text x="85" y="42" fill="#ffffff" font-family="sans-serif" font-weight="700" font-size="14">C-Suite Executive Sprint</text>
    <text x="85" y="60" fill="#94a3b8" font-family="sans-serif" font-size="11">Strategic Planning &amp; Negotiation</text>
    <text x="85" y="80" fill="#a78bfa" font-family="sans-serif" font-weight="700" font-size="12">Average 48% Salary Growth</text>

    <!-- Result Card 2 -->
    <rect x="0" y="115" width="310" height="100" rx="12" fill="url(#coachCard)" stroke="#8b5cf6" stroke-opacity="0.2" />
    <circle cx="45" cy="165" r="24" fill="#3b1d75" />
    <text x="36" y="171" fill="#a78bfa" font-size="18">🎯</text>
    <text x="85" y="157" fill="#ffffff" font-family="sans-serif" font-weight="700" font-size="14">Founder Advisory Board</text>
    <text x="85" y="175" fill="#94a3b8" font-family="sans-serif" font-size="11">Fundraising, Hiring &amp; Operations</text>
    <text x="85" y="195" fill="#a78bfa" font-family="sans-serif" font-weight="700" font-size="12">120+ Venture Founders Coached</text>

    <!-- Social Proof Badge -->
    <rect x="0" y="230" width="310" height="42" rx="8" fill="#171128" stroke="#8b5cf6" stroke-opacity="0.3" />
    <text x="20" y="256" fill="#fbbf24" font-size="12">★★★★★</text>
    <text x="78" y="256" fill="#cbd5e1" font-family="sans-serif" font-size="11" font-weight="500">Rated #1 Leadership Program 2026</text>
  </g>
</svg>
