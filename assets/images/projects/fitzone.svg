<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="fzBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14180d" />
      <stop offset="50%" stop-color="#0e1109" />
      <stop offset="100%" stop-color="#070904" />
    </linearGradient>
    <linearGradient id="limeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#84cc16" />
      <stop offset="50%" stop-color="#65a30d" />
      <stop offset="100%" stop-color="#4d7c0f" />
    </linearGradient>
    <linearGradient id="gymCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1c2414" />
      <stop offset="100%" stop-color="#10150b" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="500" rx="16" fill="url(#fzBg)" />
  <rect x="1" y="1" width="798" height="498" rx="15" fill="none" stroke="#84cc16" stroke-opacity="0.25" stroke-width="1.5" />

  <!-- Browser Header Bar -->
  <rect x="0" y="0" width="800" height="42" rx="16" fill="#131a0e" />
  <rect x="0" y="32" width="800" height="10" fill="#131a0e" />
  <circle cx="24" cy="21" r="5" fill="#ef4444" />
  <circle cx="40" cy="21" r="5" fill="#f59e0b" />
  <circle cx="56" cy="21" r="5" fill="#10b981" />
  <rect x="80" y="11" width="340" height="20" rx="6" fill="#1c2615" />
  <text x="100" y="25" fill="#bef264" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11">https://fitzone-strength.demo</text>

  <!-- Navigation -->
  <text x="40" y="76" fill="#bef264" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="20" letter-spacing="1.5">FITZONE</text>
  <text x="40" y="90" fill="#84cc16" font-family="sans-serif" font-size="8.5" letter-spacing="1">ELITE PERFORMANCE &amp; CROSSFIT</text>
  
  <text x="410" y="80" fill="#e2e8f0" font-family="sans-serif" font-size="11" opacity="0.8">Programs</text>
  <text x="480" y="80" fill="#e2e8f0" font-family="sans-serif" font-size="11" opacity="0.8">Timetable</text>
  <text x="560" y="80" fill="#e2e8f0" font-family="sans-serif" font-size="11" opacity="0.8">Trainers</text>
  <rect x="635" y="62" width="125" height="30" rx="6" fill="url(#limeGrad)" />
  <text x="652" y="81" fill="#000000" font-family="sans-serif" font-weight="900" font-size="10.5">FREE 3-DAY PASS</text>

  <!-- Hero Content -->
  <g transform="translate(40, 125)">
    <rect x="0" y="0" width="145" height="20" rx="6" fill="#243015" stroke="#84cc16" stroke-opacity="0.4" />
    <text x="12" y="14" fill="#d9f99d" font-family="sans-serif" font-size="9" font-weight="700">UNLEASH YOUR ATHLETE</text>
    
    <text x="0" y="55" fill="#ffffff" font-family="'Arial Black', sans-serif" font-weight="900" font-size="29">FORGE YOUR</text>
    <text x="0" y="90" fill="#a3e635" font-family="'Arial Black', sans-serif" font-weight="900" font-size="29">STRONGEST BODY</text>
    
    <text x="0" y="125" fill="#9ca3af" font-family="sans-serif" font-size="12">
      State-of-the-art strength zones, Olympic lifting platforms,
    </text>
    <text x="0" y="145" fill="#9ca3af" font-family="sans-serif" font-size="12">
      and science-backed personal training programs.
    </text>

    <!-- Buttons -->
    <rect x="0" y="175" width="140" height="38" rx="6" fill="url(#limeGrad)" />
    <text x="26" y="199" fill="#000000" font-family="sans-serif" font-weight="900" font-size="11.5">JOIN NOW</text>

    <rect x="155" y="175" width="125" height="38" rx="6" fill="none" stroke="#84cc16" stroke-width="1.5" />
    <text x="175" y="199" fill="#bef264" font-family="sans-serif" font-weight="700" font-size="11.5">VIEW TIMETABLE</text>
  </g>

  <!-- Visual Gym Program Card -->
  <g transform="translate(430, 115)">
    <rect x="0" y="0" width="330" height="230" rx="14" fill="url(#gymCard)" stroke="#2b3b19" stroke-width="1.5" />
    
    <!-- Graphic Dumbbell / Athletic Design -->
    <rect x="20" y="20" width="290" height="130" rx="10" fill="#0a0f06" />
    <!-- Dumbbell graphics -->
    <rect x="135" y="76" width="60" height="14" rx="3" fill="#64748b" />
    <rect x="105" y="55" width="30" height="56" rx="6" fill="#a3e635" opacity="0.9" />
    <rect x="85" y="62" width="20" height="42" rx="4" fill="#84cc16" />
    <rect x="195" y="55" width="30" height="56" rx="6" fill="#a3e635" opacity="0.9" />
    <rect x="225" y="62" width="20" height="42" rx="4" fill="#84cc16" />
    
    <!-- Heart rate pulse line -->
    <path d="M40 120 L100 120 L115 95 L130 140 L145 105 L160 120 L280 120" stroke="#bef264" stroke-width="2" fill="none" opacity="0.7" />

    <!-- Badges on image -->
    <rect x="30" y="30" width="85" height="20" rx="4" fill="#16a34a" />
    <text x="36" y="44" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="9">HIIT &amp; CROSSFIT</text>

    <!-- Program Info -->
    <rect x="20" y="165" width="290" height="52" rx="8" fill="#090d05" stroke="#223013" />
    <text x="32" y="185" fill="#f8fafc" font-family="sans-serif" font-weight="700" font-size="12">Hypertrophy &amp; Athletic Conditioning</text>
    <text x="32" y="202" fill="#9ca3af" font-family="sans-serif" font-size="9.5">60 Mins • Calorie Burn: 750+ kcal • All Levels</text>
    <text x="245" y="194" fill="#a3e635" font-family="sans-serif" font-weight="800" font-size="13">₹2,499<tspan font-size="9" fill="#d9f99d">/mo</tspan></text>
  </g>

  <!-- Bottom Featured Pillars -->
  <g transform="translate(40, 375)">
    <rect x="0" y="0" width="220" height="95" rx="10" fill="#141a0d" stroke="#263615" stroke-width="1" />
    <text x="18" y="28" fill="#bef264" font-family="sans-serif" font-weight="700" font-size="11">Elite Certified Coaches</text>
    <text x="18" y="46" fill="#9ca3af" font-family="sans-serif" font-size="9.5">1-on-1 personalized form correction</text>
    <text x="18" y="60" fill="#9ca3af" font-family="sans-serif" font-size="9.5">and nutrition roadmap guidance.</text>
    <text x="18" y="80" fill="#a3e635" font-family="sans-serif" font-size="9" font-weight="bold">Meet Coaches →</text>

    <rect x="250" y="0" width="220" height="95" rx="10" fill="#141a0d" stroke="#263615" stroke-width="1" />
    <text x="268" y="28" fill="#bef264" font-family="sans-serif" font-weight="700" font-size="11">24/7 Access &amp; App</text>
    <text x="268" y="46" fill="#9ca3af" font-family="sans-serif" font-size="9.5">Biometric studio entry, progress</text>
    <text x="268" y="60" fill="#9ca3af" font-family="sans-serif" font-size="9.5">analytics and workout logs.</text>
    <text x="268" y="80" fill="#a3e635" font-family="sans-serif" font-size="9" font-weight="bold">Explore Features →</text>

    <rect x="500" y="0" width="260" height="95" rx="10" fill="#141a0d" stroke="#263615" stroke-width="1" />
    <text x="518" y="28" fill="#bef264" font-family="sans-serif" font-weight="700" font-size="11">Sauna &amp; Recovery Lounge</text>
    <text x="518" y="46" fill="#9ca3af" font-family="sans-serif" font-size="9.5">Infrared saunas, cold plunge tubs</text>
    <text x="518" y="60" fill="#9ca3af" font-family="sans-serif" font-size="9.5">and compression boots for athletes.</text>
    <text x="518" y="80" fill="#a3e635" font-family="sans-serif" font-size="9" font-weight="bold">Recovery Perks →</text>
  </g>
</svg>
