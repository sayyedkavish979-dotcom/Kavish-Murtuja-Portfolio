<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="craftBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14110e" />
      <stop offset="50%" stop-color="#191410" />
      <stop offset="100%" stop-color="#0a0806" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="craftCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#241c14" />
      <stop offset="100%" stop-color="#140f0a" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="500" rx="16" fill="url(#craftBg)" />
  <rect x="1" y="1" width="798" height="498" rx="15" fill="none" stroke="#f59e0b" stroke-opacity="0.25" stroke-width="1.5" />

  <!-- Browser Header Bar -->
  <rect x="0" y="0" width="800" height="42" rx="16" fill="#1c1611" />
  <rect x="0" y="32" width="800" height="10" fill="#1c1611" />
  <circle cx="24" cy="21" r="5" fill="#ef4444" />
  <circle cx="40" cy="21" r="5" fill="#f59e0b" />
  <circle cx="56" cy="21" r="5" fill="#10b981" />
  <rect x="80" y="11" width="340" height="20" rx="6" fill="#2d2218" />
  <text x="100" y="25" fill="#fcd34d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11">https://metrocraft-renovations.demo</text>

  <!-- Navigation -->
  <text x="40" y="76" fill="#f59e0b" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="18" letter-spacing="1">METROCRAFT</text>
  <text x="40" y="90" fill="#d97706" font-family="sans-serif" font-size="8.5" letter-spacing="1">CUSTOM WOODWORK &amp; HOME RENOVATIONS</text>
  
  <text x="410" y="80" fill="#fef3c7" font-family="sans-serif" font-size="11" opacity="0.8">Services</text>
  <text x="475" y="80" fill="#fef3c7" font-family="sans-serif" font-size="11" opacity="0.8">Project Gallery</text>
  <text x="580" y="80" fill="#fef3c7" font-family="sans-serif" font-size="11" opacity="0.8">Reviews</text>
  <rect x="645" y="62" width="120" height="30" rx="15" fill="url(#amberGrad)" />
  <text x="660" y="81" fill="#000000" font-family="sans-serif" font-weight="bold" font-size="10.5">GET ESTIMATE</text>

  <!-- Hero Content -->
  <g transform="translate(40, 125)">
    <rect x="0" y="0" width="165" height="20" rx="10" fill="#451a03" stroke="#f59e0b" stroke-opacity="0.4" />
    <text x="12" y="14" fill="#fef3c7" font-family="sans-serif" font-size="9" font-weight="600">LOCAL TRUSTED CONTRACTOR</text>
    
    <text x="0" y="55" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="28">Master Craftsmanship</text>
    <text x="0" y="90" fill="#f59e0b" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="28">For Your Dream Home</text>
    
    <text x="0" y="125" fill="#94a3b8" font-family="sans-serif" font-size="12">
      Modular kitchens, bespoke cabinetry, interior wood paneling,
    </text>
    <text x="0" y="145" fill="#94a3b8" font-family="sans-serif" font-size="12">
      and turnkey home renovations delivered with written 10-year warranty.
    </text>

    <!-- Buttons -->
    <rect x="0" y="175" width="150" height="38" rx="8" fill="url(#amberGrad)" />
    <text x="22" y="199" fill="#000000" font-family="sans-serif" font-weight="700" font-size="11.5">VIEW WORK GALLERY</text>
    
    <rect x="162" y="175" width="145" height="38" rx="8" fill="none" stroke="#f59e0b" stroke-width="1.5" />
    <text x="180" y="199" fill="#fef3c7" font-family="sans-serif" font-weight="600" font-size="11.5">WHATSAPP ESTIMATE</text>
  </g>

  <!-- Right Visual Cards Simulation -->
  <g transform="translate(450, 125)">
    <!-- Service Card 1 -->
    <rect x="0" y="0" width="310" height="100" rx="12" fill="url(#craftCard)" stroke="#f59e0b" stroke-opacity="0.2" />
    <circle cx="45" cy="50" r="24" fill="#451a03" />
    <text x="36" y="56" fill="#f59e0b" font-size="18">🔨</text>
    <text x="85" y="42" fill="#ffffff" font-family="sans-serif" font-weight="700" font-size="14">Modular Kitchens &amp; Wardrobes</text>
    <text x="85" y="60" fill="#94a3b8" font-family="sans-serif" font-size="11">Waterproof Marine Ply &amp; German Hardware</text>
    <text x="85" y="80" fill="#f59e0b" font-family="sans-serif" font-weight="700" font-size="12">3D Design &amp; Quote in 24 Hours</text>

    <!-- Service Card 2 -->
    <rect x="0" y="115" width="310" height="100" rx="12" fill="url(#craftCard)" stroke="#f59e0b" stroke-opacity="0.2" />
    <circle cx="45" cy="165" r="24" fill="#451a03" />
    <text x="36" y="171" fill="#f59e0b" font-size="18">🏡</text>
    <text x="85" y="157" fill="#ffffff" font-family="sans-serif" font-weight="700" font-size="14">Turnkey Home Renovation</text>
    <text x="85" y="175" fill="#94a3b8" font-family="sans-serif" font-size="11">Painting, Electrical, Flooring &amp; Ceilings</text>
    <text x="85" y="195" fill="#f59e0b" font-family="sans-serif" font-weight="700" font-size="12">Fixed Timeline &amp; Cost Guarantee</text>

    <!-- Trust Badge -->
    <rect x="0" y="230" width="310" height="42" rx="8" fill="#1c1611" stroke="#f59e0b" stroke-opacity="0.3" />
    <text x="20" y="256" fill="#f59e0b" font-size="14">🛡️</text>
    <text x="45" y="256" fill="#cbd5e1" font-family="sans-serif" font-size="11" font-weight="500">250+ Local Homes Completed • 10-Yr Warranty</text>
  </g>
</svg>
