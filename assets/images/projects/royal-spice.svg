<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="rsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18120c" />
      <stop offset="50%" stop-color="#0f0c08" />
      <stop offset="100%" stop-color="#080604" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="foodCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a1f14" />
      <stop offset="100%" stop-color="#1a130c" />
    </linearGradient>
    <filter id="rsGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="500" rx="16" fill="url(#rsBg)" />
  <rect x="1" y="1" width="798" height="498" rx="15" fill="none" stroke="#f59e0b" stroke-opacity="0.2" stroke-width="1.5" />

  <!-- Browser Header Bar -->
  <rect x="0" y="0" width="800" height="42" rx="16" fill="#1f1810" />
  <rect x="0" y="32" width="800" height="10" fill="#1f1810" />
  <circle cx="24" cy="21" r="5" fill="#ef4444" />
  <circle cx="40" cy="21" r="5" fill="#f59e0b" />
  <circle cx="56" cy="21" r="5" fill="#10b981" />
  <rect x="80" y="11" width="340" height="20" rx="6" fill="#2d2216" />
  <text x="100" y="25" fill="#a89984" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11">https://royalspice-cuisine.demo</text>

  <!-- Navigation -->
  <text x="40" y="76" fill="#f59e0b" font-family="'Cinzel', serif, Georgia" font-weight="700" font-size="18" letter-spacing="2">ROYAL SPICE</text>
  <text x="40" y="90" fill="#d97706" font-family="-apple-system, sans-serif" font-size="9" letter-spacing="1">AUTHENTIC INDIAN DINING</text>
  
  <text x="420" y="80" fill="#e5e7eb" font-family="sans-serif" font-size="11" opacity="0.8">Menu</text>
  <text x="475" y="80" fill="#e5e7eb" font-family="sans-serif" font-size="11" opacity="0.8">Story</text>
  <text x="530" y="80" fill="#e5e7eb" font-family="sans-serif" font-size="11" opacity="0.8">Private Dining</text>
  <rect x="630" y="62" width="130" height="30" rx="15" fill="url(#goldGrad)" />
  <text x="655" y="81" fill="#000" font-family="sans-serif" font-weight="bold" font-size="10.5" letter-spacing="0.5">BOOK A TABLE</text>

  <!-- Hero Content -->
  <g transform="translate(40, 125)">
    <rect x="0" y="0" width="120" height="20" rx="10" fill="#382613" stroke="#d97706" stroke-opacity="0.4" />
    <text x="12" y="14" fill="#fbbf24" font-family="sans-serif" font-size="9" font-weight="600">AWARD-WINNING CHEFS</text>
    
    <text x="0" y="55" fill="#ffffff" font-family="'Cinzel', serif, Georgia" font-weight="700" font-size="28">A Royal Journey of</text>
    <text x="0" y="90" fill="#f59e0b" font-family="'Cinzel', serif, Georgia" font-weight="700" font-size="28">Indian Flavours &amp; Spices</text>
    
    <text x="0" y="125" fill="#d1d5db" font-family="sans-serif" font-size="12" opacity="0.75" width="320">
      Handcrafted Mughlai &amp; Awadhi masterpieces slow-cooked to perfection.
    </text>
    <text x="0" y="145" fill="#d1d5db" font-family="sans-serif" font-size="12" opacity="0.75">
      Experience true royal heritage on your plate.
    </text>

    <!-- Buttons -->
    <rect x="0" y="175" width="135" height="38" rx="8" fill="url(#goldGrad)" />
    <text x="24" y="199" fill="#0b0804" font-family="sans-serif" font-weight="700" font-size="11.5">EXPLORE MENU</text>

    <rect x="150" y="175" width="125" height="38" rx="8" fill="none" stroke="#f59e0b" stroke-width="1.5" />
    <text x="175" y="199" fill="#f59e0b" font-family="sans-serif" font-weight="600" font-size="11.5">OUR HERITAGE</text>
  </g>

  <!-- Visual Food Cards / Dish Showcase -->
  <g transform="translate(430, 115)">
    <!-- Main Food Feature Card -->
    <rect x="0" y="0" width="330" height="230" rx="14" fill="url(#foodCard)" stroke="#452d19" stroke-width="1.5" />
    
    <!-- Food graphic representation -->
    <circle cx="165" cy="100" r="70" fill="#2d1c10" stroke="#f59e0b" stroke-dasharray="4,4" stroke-width="1" />
    <circle cx="165" cy="100" r="56" fill="#3f1e09" />
    <circle cx="165" cy="100" r="42" fill="#d97706" opacity="0.8" filter="url(#rsGlow)" />
    <path d="M140 100 Q165 65 190 100 Q165 135 140 100" fill="#f59e0b" opacity="0.7" />
    <circle cx="165" cy="100" r="14" fill="#fbbf24" />

    <!-- Dish Title Tag -->
    <rect x="20" y="175" width="290" height="42" rx="8" fill="#120c06" stroke="#452d19" />
    <text x="35" y="195" fill="#fef3c7" font-family="sans-serif" font-weight="700" font-size="11">Dum Pukht Biryani • Awadhi Special</text>
    <text x="35" y="208" fill="#fbbf24" font-family="sans-serif" font-size="9.5">⭐ 4.9 (420+ Reviews) • 24 Karat Saffron</text>
    <text x="270" y="202" fill="#f59e0b" font-family="sans-serif" font-weight="bold" font-size="13">₹650</text>
  </g>

  <!-- Bottom Featured Trio -->
  <g transform="translate(40, 375)">
    <rect x="0" y="0" width="220" height="95" rx="10" fill="#1e150d" stroke="#3d2714" stroke-width="1" />
    <text x="18" y="28" fill="#f59e0b" font-family="sans-serif" font-weight="700" font-size="11">Dine-In &amp; Banquets</text>
    <text x="18" y="46" fill="#9ca3af" font-family="sans-serif" font-size="9.5">Exclusive royal private dining halls</text>
    <text x="18" y="60" fill="#9ca3af" font-family="sans-serif" font-size="9.5">for celebrations &amp; parties.</text>
    <text x="18" y="80" fill="#fbbf24" font-family="sans-serif" font-size="9" font-weight="bold">Reserve Hall →</text>

    <rect x="250" y="0" width="220" height="95" rx="10" fill="#1e150d" stroke="#3d2714" stroke-width="1" />
    <text x="268" y="28" fill="#f59e0b" font-family="sans-serif" font-weight="700" font-size="11">Curated Tandoori Menu</text>
    <text x="268" y="46" fill="#9ca3af" font-family="sans-serif" font-size="9.5">Charcoal flame smoked kebabs &amp;</text>
    <text x="268" y="60" fill="#9ca3af" font-family="sans-serif" font-size="9.5">artisan butter-brushed naans.</text>
    <text x="268" y="80" fill="#fbbf24" font-family="sans-serif" font-size="9" font-weight="bold">View Starters →</text>

    <rect x="500" y="0" width="260" height="95" rx="10" fill="#1e150d" stroke="#3d2714" stroke-width="1" />
    <text x="518" y="28" fill="#f59e0b" font-family="sans-serif" font-weight="700" font-size="11">Fast Online Ordering</text>
    <text x="518" y="46" fill="#9ca3af" font-family="sans-serif" font-size="9.5">Order directly for express doorstep</text>
    <text x="518" y="60" fill="#9ca3af" font-family="sans-serif" font-size="9.5">delivery in tamper-proof packaging.</text>
    <text x="518" y="80" fill="#fbbf24" font-family="sans-serif" font-size="9" font-weight="bold">Order Online →</text>
  </g>
</svg>
