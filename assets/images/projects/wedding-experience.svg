<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="wedBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f0f2b" />
      <stop offset="50%" stop-color="#11091a" />
      <stop offset="100%" stop-color="#07030a" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fceec5" />
      <stop offset="50%" stop-color="#e2be68" />
      <stop offset="100%" stop-color="#b58925" />
    </linearGradient>
    <linearGradient id="wineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#be185d" />
      <stop offset="100%" stop-color="#831843" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="500" rx="16" fill="url(#wedBg)" />
  <rect x="1" y="1" width="798" height="498" rx="15" fill="none" stroke="#d4af37" stroke-opacity="0.3" stroke-width="1.5" />

  <!-- Ambient Glow Orbs -->
  <circle cx="160" cy="180" r="150" fill="#d4af37" opacity="0.1" filter="url(#goldGlow)" />
  <circle cx="660" cy="340" r="160" fill="#be185d" opacity="0.12" filter="url(#goldGlow)" />

  <!-- Browser Header Bar -->
  <rect x="0" y="0" width="800" height="42" rx="16" fill="#160c22" />
  <rect x="0" y="32" width="800" height="10" fill="#160c22" />
  <circle cx="24" cy="21" r="5" fill="#ef4444" />
  <circle cx="40" cy="21" r="5" fill="#f59e0b" />
  <circle cx="56" cy="21" r="5" fill="#10b981" />
  <rect x="80" y="11" width="370" height="20" rx="6" fill="#261638" />
  <text x="100" y="25" fill="#e5c07b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11">https://kavishmurtuja.com/wedding-experience</text>

  <!-- Status Badge -->
  <rect x="630" y="12" width="130" height="18" rx="9" fill="rgba(212,175,55,0.15)" stroke="rgba(212,175,55,0.4)" stroke-width="1" />
  <circle cx="642" cy="21" r="3" fill="#d4af37" />
  <text x="652" y="24" fill="#f5df9a" font-family="-apple-system, sans-serif" font-size="9" font-weight="700">CONCEPT DEMO</text>

  <!-- Decorative Corner Filigrees -->
  <path d="M 30,70 Q 50,70 50,50" stroke="url(#goldGrad)" stroke-width="1.5" fill="none" opacity="0.6" />
  <path d="M 770,70 Q 750,70 750,50" stroke="url(#goldGrad)" stroke-width="1.5" fill="none" opacity="0.6" />
  <path d="M 30,460 Q 50,460 50,480" stroke="url(#goldGrad)" stroke-width="1.5" fill="none" opacity="0.6" />
  <path d="M 770,460 Q 750,460 750,480" stroke="url(#goldGrad)" stroke-width="1.5" fill="none" opacity="0.6" />

  <!-- Center Luxury Card Mockup -->
  <rect x="150" y="75" width="500" height="385" rx="16" fill="rgba(26,16,38,0.85)" stroke="url(#goldGrad)" stroke-width="1.5" />
  
  <!-- Intertwined Wedding Rings Icon -->
  <g transform="translate(400, 125)">
    <circle cx="-10" cy="0" r="16" fill="none" stroke="url(#goldGrad)" stroke-width="3.5" filter="url(#goldGlow)" />
    <circle cx="10" cy="0" r="16" fill="none" stroke="url(#goldGrad)" stroke-width="3.5" />
    <polygon points="0,-18 5,-26 -5,-26" fill="#ffffff" opacity="0.9" />
  </g>

  <!-- Card Monogram & Couple Header -->
  <text x="400" y="172" text-anchor="middle" fill="#d4af37" font-family="Georgia, serif" font-size="11" letter-spacing="4" text-transform="uppercase">TOGETHER WITH THEIR FAMILIES</text>
  <text x="400" y="215" text-anchor="middle" fill="url(#goldGrad)" font-family="Georgia, serif" font-size="34" font-weight="bold" letter-spacing="1">Aarav &amp; Anaya</text>
  <text x="400" y="240" text-anchor="middle" fill="#d6c8b9" font-family="-apple-system, sans-serif" font-size="13" font-style="italic">Two hearts. One beautiful beginning.</text>

  <!-- Date Pill -->
  <rect x="310" y="258" width="180" height="26" rx="13" fill="rgba(212,175,55,0.12)" stroke="rgba(212,175,55,0.3)" stroke-width="1" />
  <text x="400" y="275" text-anchor="middle" fill="#f5df9a" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">15 DECEMBER 2026</text>

  <!-- Mini Countdown Ticker Preview -->
  <g transform="translate(200, 305)">
    <!-- Days -->
    <rect x="0" y="0" width="85" height="52" rx="8" fill="rgba(11,7,17,0.9)" stroke="rgba(212,175,55,0.2)" stroke-width="1" />
    <text x="42" y="30" text-anchor="middle" fill="url(#goldGrad)" font-family="Georgia, serif" font-size="18" font-weight="bold">92</text>
    <text x="42" y="44" text-anchor="middle" fill="#9e8e7e" font-family="-apple-system, sans-serif" font-size="8" font-weight="bold">DAYS</text>

    <!-- Hours -->
    <rect x="105" y="0" width="85" height="52" rx="8" fill="rgba(11,7,17,0.9)" stroke="rgba(212,175,55,0.2)" stroke-width="1" />
    <text x="147" y="30" text-anchor="middle" fill="url(#goldGrad)" font-family="Georgia, serif" font-size="18" font-weight="bold">14</text>
    <text x="147" y="44" text-anchor="middle" fill="#9e8e7e" font-family="-apple-system, sans-serif" font-size="8" font-weight="bold">HOURS</text>

    <!-- Minutes -->
    <rect x="210" y="0" width="85" height="52" rx="8" fill="rgba(11,7,17,0.9)" stroke="rgba(212,175,55,0.2)" stroke-width="1" />
    <text x="252" y="30" text-anchor="middle" fill="url(#goldGrad)" font-family="Georgia, serif" font-size="18" font-weight="bold">38</text>
    <text x="252" y="44" text-anchor="middle" fill="#9e8e7e" font-family="-apple-system, sans-serif" font-size="8" font-weight="bold">MINUTES</text>

    <!-- Seconds -->
    <rect x="315" y="0" width="85" height="52" rx="8" fill="rgba(11,7,17,0.9)" stroke="rgba(212,175,55,0.2)" stroke-width="1" />
    <text x="357" y="30" text-anchor="middle" fill="url(#goldGrad)" font-family="Georgia, serif" font-size="18" font-weight="bold">45</text>
    <text x="357" y="44" text-anchor="middle" fill="#9e8e7e" font-family="-apple-system, sans-serif" font-size="8" font-weight="bold">SECONDS</text>
  </g>

  <!-- Interactive Features Badges Row -->
  <g transform="translate(190, 385)">
    <rect x="0" y="0" width="130" height="24" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.1)" />
    <text x="65" y="16" text-anchor="middle" fill="#d6c8b9" font-family="-apple-system, sans-serif" font-size="10">🎨 4 Events Schedule</text>

    <rect x="145" y="0" width="135" height="24" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.1)" />
    <text x="212" y="16" text-anchor="middle" fill="#d6c8b9" font-family="-apple-system, sans-serif" font-size="10">💌 WhatsApp RSVP</text>

    <rect x="295" y="0" width="125" height="24" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.1)" />
    <text x="357" y="16" text-anchor="middle" fill="#d6c8b9" font-family="-apple-system, sans-serif" font-size="10">✨ Send Blessings</text>
  </g>

  <!-- Footer Tagline -->
  <text x="400" y="438" text-anchor="middle" fill="#e5c07b" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" letter-spacing="0.5">THE GRAND PALACE • KANPUR, UTTAR PRADESH</text>
</svg>
