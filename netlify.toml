  from = "/process"
  to = "/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/process/*"
  to = "/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/testimonials"
  to = "/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/testimonials/*"
  to = "/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/pricing"
  to = "/index.html"
  status = 200
  force = true

[[redirects]]
