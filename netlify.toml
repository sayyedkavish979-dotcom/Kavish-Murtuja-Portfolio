  to = "/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/faq/*"
  to = "/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/contact"
  to = "/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/contact/*"
  to = "/index.html"
  status = 200
  force = true

# Catch-all Netlify SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
