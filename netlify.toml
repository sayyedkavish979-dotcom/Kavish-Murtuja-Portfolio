[build]
  publish = "."

# High-priority SPA rewrites for explicit subpage paths to prevent Netlify from serving fallback directory files
[[redirects]]
  from = "/about"
  to = "/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/about/*"
  to = "/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/services"
  to = "/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/services/*"
  to = "/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/portfolio"
  to = "/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/portfolio/*"
  to = "/index.html"
  status = 200
  force = true

